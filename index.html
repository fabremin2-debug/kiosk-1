const diffMins = (sd,st,ed,et) => { if(!sd||!st||!ed||!et) return 0; const d=Math.round((new Date(`${ed}T${et}`)-new Date(`${sd}T${st}`))/60000); return d>0?d:0; };
const diffDays = (sd,ed) => { if(!sd||!ed) return 0; const d=Math.round((new Date(ed)-new Date(sd))/86400000)+1; return d>0?d:0; };
const calcFee  = (eq,mins,days,qty) => {
  if(!eq) return 0;
  let base=0;
  if(eq.unit==="L") base=(parseInt(qty)||0)*eq.fee;
  else if(eq.unit==="Day") base=(days||1)*eq.fee;
  else base=Math.ceil((mins||0)/60)*eq.fee;
  return Math.floor(base * 1.1 / 10) * 10;
};

const fmtDate = s => { if(!s||s==="미정") return s||""; if(s.includes("GMT")||s.includes("표준시")){const d=new Date(s);if(!isNaN(d.getTime())) return `${d.getMonth()+1}월 ${d.getDate()}일`;} if(/^\d{4}-\d{2}-\d{2}/.test(s)){const p=s.slice(0,10).split("-");return `${parseInt(p[1])}월 ${parseInt(p[2])}일`;} return s; };

function ACInput({value, onChange, placeholder, suggestions}){
  const [show,setShow]=React.useState(false);
  const filtered=React.useMemo(()=>value?suggestions.filter(s=>s!=="직접입력"&&s.replace(/[㈜㈔()（）]/g,"").toLowerCase().includes(value.replace(/[㈜㈔()（）]/g,"").toLowerCase())).slice(0,6):[],[value]);
  return(
    <div style={{position:"relative",marginBottom:14}}>
      <input value={value} onChange={e=>{onChange(e.target.value);setShow(true);}} onBlur={()=>setTimeout(()=>setShow(false),150)} onFocus={()=>setShow(true)} placeholder={placeholder||"업체명 입력 (일부만 입력 시 목록 표시)"} style={{...IS,marginBottom:0}}/>
      {show&&filtered.length>0&&(
        <div style={{position:"absolute",top:"100%",left:0,right:0,background:"#fff",border:"1.5px solid #94a3b8",borderRadius:10,zIndex:200,boxShadow:"0 4px 16px rgba(0,0,0,0.1)",maxHeight:180,overflowY:"auto"}}>
          {filtered.map(s=><div key={s} onMouseDown={()=>{onChange(s);setShow(false);}} style={{padding:"10px 14px",cursor:"pointer",fontSize:13,color:"#0f172a",borderBottom:"1px solid #f1f5f9"}}>{s}</div>)}
        </div>
      )}
    </div>
  );
}

function ReservationPage({onBack}){
  const [ec,setEc]=React.useState("");
  const [cu,setCu]=React.useState(""); const [wo,setWo]=React.useState(""); const [ph,setPh]=React.useState("");
  const [sdt,setSdt]=React.useState(todayStr()); const [edt,setEdt]=React.useState("");
  const [done,setDone]=React.useState(false);
  const [reservations,setReservations]=React.useState([]);
  const [loading,setLoading]=React.useState(false);
  const [calMonth,setCalMonth]=React.useState(new Date());
  const maxDate=new Date(Date.now()+21*86400000).toISOString().slice(0,10);
  React.useEffect(()=>{
    if(!ec) return;
    setLoading(true); setReservations([]);
    const eqName=EQUIPMENT.find(e=>e.code===ec)?.name||"";
    const cbName="cb_"+Date.now();
    const s=document.createElement("script");
    s.src=SCRIPT_URL+"?action=getReservations&장비명="+encodeURIComponent(eqName)+"&callback="+cbName;
    window[cbName]=(data)=>{if(data.result==="success") setReservations(data.data||[]); delete window[cbName]; document.body.removeChild(s); setLoading(false);};
    s.onerror=()=>{setLoading(false);delete window[cbName];};
    document.body.appendChild(s);
  },[ec]);
  const eq=EQUIPMENT.find(e=>e.code===ec);
  const days=Math.max(diffDays(sdt,edt),1);
  const valid=cu&&wo&&ec&&sdt&&edt;
  const bookedDates=React.useMemo(()=>{const set=new Set();reservations.forEach(r=>{if(!r.예약시작일||!r.예약종료일) return;let cur=new Date(r.예약시작일);const end=new Date(r.예약종료일);while(cur<=end){set.add(cur.toISOString().slice(0,10));cur.setDate(cur.getDate()+1);}});return set;},[reservations]);
  const renderCal=()=>{
    const year=calMonth.getFullYear(),month=calMonth.getMonth();
    const first=new Date(year,month,1).getDay(),dim=new Date(year,month+1,0).getDate(),today=todayStr();
    const cells=[];

              <div style={{background:"#eff6ff",borderRadius:10,padding:"12px 14px",marginBottom:16,display:"flex",justifyContent:"space-between",border:"1px solid #bfdbfe"}}>
                <span style={{color:"#64748b",fontSize:13}}>합계(부가세 포함)</span>
                <span style={{color:"#2563eb",fontWeight:700}}>{records.filter(r=>typeof r.수수료==="number").reduce((s,r)=>s+r.수수료,0).toLocaleString()}원</span>
              </div>
              <GBtn label="← 홈으로" onClick={()=>setStep("home")}/>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
